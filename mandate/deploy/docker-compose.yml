# Mandate on one server: HTTPS proxy -> gateway -> seller, Postgres beside the gateway.
# The seller and Postgres are never published. See docs/DEPLOY.md.
#   cd mandate/deploy
#   docker compose --env-file ../.env up -d --build
# --env-file ../.env fills the ${...} values below; the gateway also reads the whole file.
# The seller only ever receives MANDATE_SELLER_TOKEN.
name: mandate

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in ../.env}
      MANDATE_READONLY_PASSWORD: ${MANDATE_READONLY_PASSWORD:?set MANDATE_READONLY_PASSWORD in ../.env}
    # A share of a 4 GiB VM. Huge pages are off; a small VM often has none.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - max_connections=40
      - -c
      - huge_pages=off
    shm_size: 1gb
    volumes:
      # Empty MANDATE_PGDATA selects the named volume. /srv/mandate/postgres puts the files on the data disk.
      - ${MANDATE_PGDATA:-mandate_pgdata}:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    expose: ["5432"]
    healthcheck:
      test: ["CMD", "psql", "-q", "-U", "mandate_gateway", "-d", "mandate", "-c", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    build: ..
    image: mandate:latest
    restart: "no"
    env_file: ../.env
    entrypoint: ["/bin/sh", "/home/mandate/with-database.sh"]
    command: ["python", "-m", "backend.migrate"]
    volumes:
      - ./postgres/with-database.sh:/home/mandate/with-database.sh:ro
    healthcheck:
      disable: true                            # the image healthcheck probes the gateway port
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build: ..
    image: mandate:latest
    restart: unless-stopped
    env_file: ../.env
    entrypoint: ["/bin/sh", "/home/mandate/with-database.sh"]
    # Same command as the image. Setting an entrypoint drops the image command, so it is repeated here.
    command: ["uvicorn", "backend.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      MANDATE_SELLER_URL: http://seller:8001
      MANDATE_TRUST_PROXY_HEADERS: "1"        # the only way in is through Caddy below
      QATOM_TOKEN_FILE: /home/mandate/.qatom/token.json
    volumes:
      - ./secrets/qatom-token.json:/home/mandate/.qatom/token.json:ro
      - ./postgres/with-database.sh:/home/mandate/with-database.sh:ro
    expose: ["8000"]
    depends_on:
      seller:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    labels:
      # Read only by the optional Datadog agent below (profile "monitoring").
      com.datadoghq.ad.logs: '[{"source": "python", "service": "mandate-gateway"}]'
      com.datadoghq.ad.checks: '{"http_check": {"instances": [{"name": "mandate-ready", "url": "http://%%host%%:8000/ready", "timeout": 5}]}}'

  seller:
    image: mandate:latest
    restart: unless-stopped
    command: ["uvicorn", "backend.seller_api.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      MANDATE_SELLER_TOKEN: ${MANDATE_SELLER_TOKEN:?set MANDATE_SELLER_TOKEN in ../.env}
    healthcheck:
      disable: true                            # the image healthcheck probes the gateway port
    expose: ["8001"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      MANDATE_DOMAIN: ${MANDATE_DOMAIN:?set MANDATE_DOMAIN (for example api.example.com) in ../.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [gateway]

  # Optional monitoring: docker compose --env-file ../.env --profile monitoring up -d
  # Needs DD_API_KEY (and DD_SITE if not datadoghq.com) in ../.env. Collects the gateway's JSON logs,
  # container metrics and a /ready check every 15 seconds. Nothing is sent unless this profile is on.
  datadog:
    image: gcr.io/datadoghq/agent:7
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      DD_API_KEY: ${DD_API_KEY:-}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_HOSTNAME: ${MANDATE_DOMAIN:-mandate}
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "false"   # only containers labelled above
      DD_PROCESS_AGENT_ENABLED: "false"
      DD_APM_ENABLED: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro

volumes:
  caddy_data:
  caddy_config:
  mandate_pgdata:
